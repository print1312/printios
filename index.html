<body>
  <div class="loading" role="status">
    <h1>🏷️ Niimbot Druckstudio</h1>
    <p id="boot-error">Druckstudio wird geladen …</p>
    <p style="font-size:.86rem;color:#475569">Auf dem iPhone die veröffentlichte HTTPS-Adresse in der App <strong>Bluefy</strong> öffnen – Safari und Chrome auf iOS unterstützen kein Web Bluetooth.</p>
    <button id="retry" onclick="location.reload()" hidden>Erneut versuchen</button>
  </div>
  <script>
  (async function loadOriginalDemo(){
    const APP_VERSION='18';
    const REMOTE = new URL('./',window.location.href).href;
    const showError=(text)=>{const el=document.getElementById('boot-error');el.textContent=text;el.className='err';document.getElementById('retry').hidden=false;};
    if(location.protocol==='file:'){showError('Bitte nicht als lokale Datei öffnen. Die App funktioniert nur über eine Webadresse (GitHub Pages, https://…) oder einen lokalen Webserver.');return;}
    let html='',lastError='';
    try{
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
      let res;try{res=await fetch(REMOTE+'niimbot-demo.html?v='+APP_VERSION,{cache:'no-cache',signal:controller.signal});}finally{clearTimeout(timeout);}
      if(!res.ok)throw Error('HTTP '+res.status);
      const source=await res.text();
      if(!source.includes('id="identify"') || !source.includes('id="rollbox"') || !source.includes('Niimbot'))
        throw Error('niimbot-demo.html hat nicht den erwarteten Inhalt.');
      html=source.replace('const t = Date.now();', 'const t = "v'+APP_VERSION+'";').replace(/<html[^>]*>/,'<html lang="de">').replace(/<title>[\s\S]*?<\/title>/,'<title>Niimbot Druckstudio</title>');
    }catch(e){lastError=(e&&e.name==='AbortError')?'Zeitüberschreitung beim Laden':(e&&e.message)||String(e);}
    if(!html){
      showError('Die App-Dateien konnten nicht geladen werden. Bitte prüfen, ob alle Dateien direkt im Hauptverzeichnis des Repositorys liegen (keine Unterordner).\nDetails: '+lastError);
      return;
    }
    const ownAddon=new URL('addon.js?v='+APP_VERSION,window.location.href).href;
    const base='<base href="'+REMOTE+'">';
    const extraStyle=`<style>

            <label>Textfeld-Breite (px)<input id="dd-boxwidth" type="number" min="20" max="4000" value="150" inputmode="numeric"></label>
            <label>Textfeld-Höhe (px)<input id="dd-boxheight" type="number" min="20" max="4000" value="80" inputmode="numeric"></label>
          </div>
          <div class="dd-toolbar">
            <button id="dd-textbold" type="button" aria-pressed="false"><b>B</b></button>
            <button id="dd-textitalic" type="button" aria-pressed="false"><i>I</i></button>
            <button id="dd-textunderline" type="button" aria-pressed="false"><u>U</u></button>
            <button id="dd-textstrike" type="button" aria-pressed="false"><s>S</s></button>
            <label class="dd-check"><input id="dd-textinverse" type="checkbox"> Schwarz ausgefülltes Textfeld / weiße Schrift</label>
          </div>
          <div class="dd-row"><label>Zeichenabstand (px)<input id="dd-letterspace" type="number" min="-5" max="30" step=".5" value="0"></label>
            <label>Zeilenabstand (%)<input id="dd-lineheight" type="number" min="70" max="300" step="5" value="120"></label></div>
          <div class="dd-section-title">Textrichtung</div>
          <div class="dd-flow-buttons">
            <button id="dd-flow-horizontal" type="button" aria-pressed="true">ABC → Gerade</button>
            <button id="dd-flow-vertical" type="button" aria-pressed="false">ABC ↓ Vertikal</button>
            <button id="dd-flow-curve" type="button" aria-pressed="false">ABC ⤿ Rundung</button>
          </div>
                    <div id="dd-curve-controls" class="dd-subpanel" hidden>
            <div class="dd-caption">Niimbot-ähnliche Rundung: Bogenposition, Innen-/Außenseite, Radius und Winkel direkt für runde Sticker einstellen.</div>
            <div class="dd-section-title" style="margin-top:0">Bogenposition</div>
            <div class="dd-flow-buttons">
              <button id="dd-curve-place-top" type="button" aria-pressed="true">Oben</button>
              <button id="dd-curve-place-bottom" type="button" aria-pressed="false">Unten</button>
              <button id="dd-curve-place-circle" type="button" aria-pressed="false">Voller Kreis</button>
            </div>
            <div class="dd-section-title">Innen / Außen</div>
            <div class="dd-flow-buttons">
              <button id="dd-curve-facing-outside" type="button" aria-pressed="true">Außen</button>
              <button id="dd-curve-facing-inside" type="button" aria-pressed="false">Innen</button>
              <button id="dd-curve-duplicate-opposite" type="button">Gegenbogen duplizieren</button>
            </div>
            <div class="dd-rotationrow" style="margin-top:8px"><label for="dd-curvedeg" style="font-size:.85rem">Bogenwinkel</label><input id="dd-curvedeg" type="range" min="0" max="360" step="1" value="180" aria-label="Text-Rundung in Grad">
            <input id="dd-curvedeg-num" type="number" min="0" max="360" step="1" value="180" inputmode="numeric" aria-label="Text-Rundung Grad"><span class="dd-badge">°</span></div>
            <div class="dd-rotationrow" style="margin-top:8px"><label for="dd-curveradius" style="font-size:.85rem">Radius</label><input id="dd-curveradius" type="range" min="0" max="1200" step="1" value="0" aria-label="Text-Radius in Pixel">
            <input id="dd-curveradius-num" type="number" min="0" max="1200" step="1" value="0" inputmode="numeric" aria-label="Text-Radius in Pixel"><span class="dd-badge">px</span><button id="dd-curveradius-auto" type="button">Auto</button></div>
            <p class="dd-caption" style="margin:8px 0 0">0 px = Radius automatisch aus der Textfeldgröße ableiten. Für getrennten oberen und unteren Rundtext kannst du „Gegenbogen duplizieren“ verwenden und beide Texte anschließend separat bearbeiten.</p>
          </div>
          <div class="dd-row"><label>Textrotation (°)<input id="dd-textrotation" type="number" min="-360" max="360" step="1" value="0"></label>
            <label>Textfeld-Zoom (%)<input id="dd-textzoom" type="number" min="5" max="4000" step="1" value="100" inputmode="numeric"></label>
            <label>Textgröße anpassen<select id="dd-textscaling"><option value="none">Wie eingegeben</option><option value="fit">Automatisch in Textbreite einpassen</option></select></label></div>
          <div class="dd-row"><label>Vertikale Textausrichtung<select id="dd-textvertical"><option value="top">Oben</option><option value="middle" selected>Mitte</option><option value="bottom">Unten</option></select></label>
            <label>Zeilenumbruch<select id="dd-textwrap"><option value="word">Nach Wörtern</option><option value="char">Nach Zeichen</option><option value="off">Kein automatischer Umbruch</option></select></label></div>
          <div class="dd-toolbar"><button id="dd-txt-align-left" type="button">↤ Links</button><button id="dd-txt-align-hcenter" type="button">↔ Mitte</button><button id="dd-txt-align-right" type="button">Rechts ↦</button><button id="dd-txt-align-top" type="button">↑ Oben</button><button id="dd-txt-align-vcenter" type="button">↕ Mitte</button><button id="dd-txt-align-bottom" type="button">↓ Unten</button></div>
          <div class="dd-row"><label>Text horizontal (px)<input id="dd-textx" type="number" step="1" inputmode="decimal"></label><label>Text vertikal (px)<input id="dd-texty" type="number" step="1" inputmode="decimal"></label></div>
          <p class="dd-muted">Textfeld antippen: es wird aktiv. Mit einem Finger verschieben, zwei Finger drehen/vergrößern. Griff oben links: drehen; rechts: Breite; unten: Höhe; unten rechts: Text und Rahmen gemeinsam skalieren. Die Rotation/Zoom-Steuerung oberhalb der Vorschau gilt jetzt für das aktive Textfeld. Der schwarze Hintergrund bei „Weiß auf Schwarz“ füllt immer das ganze Textfeld.</p>
          <div class="dd-toolbar"><button id="dd-select-image" type="button">Bild auswählen</button><button id="dd-text-tofront" type="button">In den Vordergrund</button><button id="dd-text-toback" type="button">In den Hintergrund</button></div>
          <div class="dd-caption">Ebenen (oben in der Liste = vorne). Mehrere Bilder und Texte lassen sich unabhängig verschieben, zuschneiden und stapeln.</div><div id="dd-layers" class="dd-layerlist"></div>
        </div>
        <details class="dd-fontbox"><summary>Aa Eigene Schriftarten hochladen</summary>
          <p class="dd-muted">TTF, OTF, WOFF oder WOFF2 auswählen. Fonts werden lokal in diesem Browserprofil (IndexedDB) gespeichert und beim nächsten Besuch wieder geladen.</p>
          <input id="dd-fontfile" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" multiple>
          <p id="dd-fontstatus" class="dd-muted" role="status">Noch keine eigenen Fonts geladen.</p><div id="dd-fontlist"></div>
          <button id="dd-fontpersistent" type="button">Speicher dauerhaft anfordern</button>
          <p class="dd-muted">Achtung: Browserdaten löschen oder einen anderen Browser/eine andere Website verwenden entfernt bzw. trennt die gespeicherten Fonts. Bewahre deine Original-Fontdateien als Backup auf.</p>
        </details>
      </div>
      <div class="dd-row"><button id="dd-print" type="button" class="primary" disabled>🖨️ Drucken</button>
        <button id="dd-stop" type="button" disabled>Nach dem Stapel stoppen</button></div>
      <progress id="dd-progress" max="100" value="0"></progress>
      <div id="dd-state" role="status" aria-live="polite">Dateien auswählen, Drucker verbinden und Rolle wählen.</div>
      <p class="dd-warning">Tipp: Für den ersten Test nur 1 Etikett drucken. Ein abgebrochener Auftrag kann bereits teilweise gedruckt sein. Die Bluetooth-Auswahl öffnet sich über „🔗 Verbinden“ oben.</p>
    </section>`;
    if(!html.includes('</head>')||!html.includes('</body>')||!html.includes('<body>')){
      document.getElementById('boot-error').textContent='Ungültiges HTML aus der Originalquelle.';return;
    }
    html=html.replace(/<meta name="viewport"[^>]*>/i,'');
    html=html.replace('<head>', '<head>'+base+'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2444"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no">');
    html=html.replace('</head>',extraStyle+'</head>');
    html=html.replace('<details id="rollbox">',addonMarkup+'<details id="rollbox">');
    html=html.replace('</body>',`<dialog id="dd-crop-dialog" aria-label="Bild zuschneiden">
      <div class="crop-body">
        <h3>✂️ Bild zuschneiden</h3><div id="dd-crop-title" class="dd-caption">Bildausschnitt festlegen</div>
        <div id="dd-crop-presets" class="crop-presets" role="group" aria-label="Bildverhältnis">
          <button type="button" data-crop-preset="free" aria-pressed="true">Frei</button>
          <button type="button" data-crop-preset="1:1">1×1</button><button type="button" data-crop-preset="4:6">4×6</button>
          <button type="button" data-crop-preset="3:5">3×5</button><button type="button" data-crop-preset="5:8">5×8</button>
          <button type="button" data-crop-preset="2:3">2×3</button><button type="button" data-crop-preset="4:7">4×7</button>
          <button type="button" data-crop-preset="5:7">5×7</button><button type="button" data-crop-preset="circle">◯ Kreis</button>
        </div>
        <canvas id="dd-crop-canvas" aria-label="Ausschnitt verschieben und an der unteren rechten Ecke vergrößern"></canvas>
        <p class="dd-caption">Im Bild verschieben; den blauen Griff unten rechts ziehen, um den Ausschnitt anzupassen. Der Ausschnitt bleibt beim Drucken erhalten. Kreis erzeugt eine transparente runde Maske.</p>
        <div class="crop-actions"><button type="button" id="dd-crop-reset">Zurücksetzen</button><button type="button" id="dd-crop-cancel">Abbrechen</button><button type="button" id="dd-crop-save">Übernehmen</button></div>
      </div></dialog><script type="module" src="${ownAddon}"></scr`+`ipt></body>`);
    document.open(); document.write(html); document.close();
  })().catch(e=>{
    const el=document.getElementById('boot-error');
    if(el)el.textContent='Start fehlgeschlagen: '+((e&&e.message)||e);
    const btn=document.getElementById('retry');if(btn)btn.hidden=false;
  });
  </script>
</body>
</html>
